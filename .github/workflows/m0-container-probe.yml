name: M0 - Infinite Canvas source and container smoke test

on:
  push:
    branches:
      - codex/m0-container-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout the exact source under test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Verify the source revision and static container configuration
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f web/package.json
          docker compose -f docker-compose.local.yml config --quiet

      - name: Install frontend dependencies and run the source tests
        id: source_tests
        shell: bash
        working-directory: web
        run: |
          set -Eeuo pipefail
          bun install --frozen-lockfile
          bun test

      - name: Test the workflow regression fixtures
        shell: bash
        run: python3 tests/m0-workflows.test.py

      - name: Build and start Infinite Canvas
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose -f docker-compose.local.yml up -d --build

      - name: Smoke test the web app
        id: web_smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          import subprocess
          import time
          from urllib.parse import urljoin, urlparse
          from urllib.request import urlopen

          origin = "http://127.0.0.1:3000/"

          class Page(HTMLParser):
              root = False
              modules = None

              def __init__(self):
                  super().__init__()
                  self.modules = []

              def handle_starttag(self, tag, attributes):
                  attributes = dict(attributes)
                  if tag == "div" and attributes.get("id") == "root":
                      self.root = True
                  if tag == "script" and attributes.get("type") == "module" and attributes.get("src"):
                      self.modules.append(attributes["src"])

          try:
              for attempt in range(90):
                  try:
                      with urlopen(origin, timeout=5) as response:
                          body = response.read()
                          if response.status == 200 and body:
                              assert response.geturl() == origin, "Root unexpectedly redirected"
                              assert response.headers.get_content_type() == "text/html", "Root is not HTML"
                              break
                  except OSError:
                      pass
                  time.sleep(2)
              else:
                  raise RuntimeError("Web app did not become ready")

              page = Page()
              page.feed(body.decode("utf-8"))
              assert page.root, "Root page does not contain the React root"
              assert page.modules, "Root page does not reference a built JavaScript module"
              for source in page.modules:
                  asset = urljoin(origin, source)
                  assert urlparse(asset).netloc == urlparse(origin).netloc, "Module is not served by the app"
                  assert urlparse(asset).path.endswith(".js"), "Module is not a built JavaScript asset"
                  with urlopen(asset, timeout=5) as response:
                      script = response.read()
                      mime = response.headers.get_content_type()
                      assert response.status == 200 and script, "JavaScript asset is missing or empty"
                      assert mime in {"text/javascript", "application/javascript"}, f"JavaScript asset served as {mime}"
                      assert not script.lstrip().lower().startswith((b"<!doctype html", b"<html")), "JavaScript asset contains HTML"
                  print(f"JavaScript smoke passed: {source} ({mime}, {len(script)} bytes)")
              print(f"Root smoke passed: HTTP 200, {len(body)} bytes, React root present")
          except Exception:
              subprocess.run(["docker", "compose", "-f", "docker-compose.local.yml", "logs", "--tail=160"])
              raise
          PY

      - name: Record results
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_TEST_RESULT: ${{ steps.source_tests.outcome }}
          WEB_SMOKE_RESULT: ${{ steps.web_smoke.outcome }}
        run: |
          {
            echo "## M0 Docker smoke test"
            echo ""
            echo "- Tested source revision: $SOURCE_SHA"
            echo "- Frontend source tests: $SOURCE_TEST_RESULT"
            echo "- Root and JavaScript asset smoke test: $WEB_SMOKE_RESULT"
            echo "- AI coding runtime: see the separate registry diagnostic; an OCI MCP profile cannot run as a container."
            echo ""
            echo "The static app requires no admin credentials or model API keys. The test app is not published."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up test containers
        if: always()
        shell: bash
        run: |
          docker compose -f docker-compose.local.yml down -v --remove-orphans || true
